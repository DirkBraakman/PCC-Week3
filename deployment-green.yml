apiVersion: apps/v1
kind: Deployment
metadata:
  name: pcc-nginx-green
spec:
  replicas: 2 # Number of instances (pods) to run
  selector:
    matchLabels:
      app: pcc-nginx
      version: green
  # everything under template is the definition of the pod that will be created.
  template:
    metadata:
      labels:
        app: pcc-nginx
        version: green
    spec:
      containers:
        - name: pcc-nginx
          # Image stored in Google Artifact Registry
          image: europe-west4-docker.pkg.dev/ce-week-1/pcc-week3/nginx:green
          ports:
            - containerPort: 80
